<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅行割り勘・精算アプリ</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 12px; background: #f2f4f8; color: #222; padding-bottom: 96px; }
    .card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 14px; }
    h2 { margin: 0 0 12px; font-size: 1.05rem; color: #111; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    label.field-label { display: block; font-size: 0.85rem; font-weight: bold; color: #555; margin-top: 8px; }
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 12px; margin: 4px 0 10px; border: 1px solid #d0d7de; border-radius: 8px; font-size: 16px; background: #fff;
    }
    button {
      width: 100%; padding: 13px; margin: 6px 0; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; color: #fff; background: #0066cc; cursor: pointer; touch-action: manipulation;
    }
    button:active { opacity: 0.85; }
    button:disabled { background: #99c2ff; cursor: not-allowed; }
    .btn-green { background: #28a745; }
    .btn-line { background: #06C755; }
    .btn-scan { background: #6f42c1; margin-bottom: 10px; }
    .btn-archive { background: #64748b; margin-top: 10px; }
    .btn-opt { background: #f0f4f8; color: #0066cc; border: 1.5px solid #0066cc; font-size: 0.9rem; padding: 10px; margin: 8px 0; }
    .btn-sub { width: auto; padding: 6px 12px; font-size: 0.8rem; background: #6c757d; margin: 0; }

    /* 端数丸め切り替えセグメント */
    .round-toggle { display: inline-flex; background: #e2e8f0; border-radius: 8px; padding: 3px; }
    .round-btn { width: auto; padding: 5px 10px; margin: 0; font-size: 0.78rem; border-radius: 6px; background: transparent; color: #475569; font-weight: bold; }
    .round-btn.active { background: #0066cc; color: #fff; }

    /* 対象者チップ */
    .checkbox-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0 14px; }
    .check-chip {
      display: flex; align-items: center; padding: 10px 12px; border: 1.5px solid #d0d7de; border-radius: 8px; background: #fafbfc; cursor: pointer; font-size: 15px; user-select: none;
    }
    .check-chip input { width: 18px; height: 18px; margin-right: 8px; accent-color: #0066cc; }
    .check-chip:has(input:checked) { border-color: #0066cc; background: #eef6ff; font-weight: bold; }

    /* 品物別オプション */
    .itemized-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; margin: 10px 0 14px; }
    .line-item-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .line-item-top { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .line-item-top input[type="text"] { flex: 2; margin: 0; padding: 8px; font-size: 15px; }
    .line-item-top input[type="number"] { flex: 1; margin: 0; padding: 8px; font-size: 15px; }
    .line-del-btn { width: auto; background: #ff4d4f; padding: 8px 10px; margin: 0; font-size: 0.8rem; }
    .mini-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .mini-chip {
      display: inline-flex; align-items: center; padding: 5px 10px; border: 1px solid #cbd5e1; border-radius: 16px; font-size: 13px; background: #f8fafc; cursor: pointer; user-select: none;
    }
    .mini-chip input { display: none; }
    .mini-chip:has(input:checked) { background: #0066cc; color: #fff; border-color: #0066cc; font-weight: bold; }
    .tax-note { font-size: 0.8rem; color: #475569; background: #e2e8f0; padding: 8px; border-radius: 6px; margin-top: 6px; }

    /* 精算結果・総出費サマリー・履歴 */
    .settlement-item { background: #eef6ff; padding: 12px; border-left: 4px solid #0066cc; border-radius: 6px; margin-bottom: 8px; font-size: 0.95rem; }
    .summary-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-top: 6px; }
    .summary-table th, .summary-table td { padding: 8px 6px; border-bottom: 1px solid #eee; text-align: right; }
    .summary-table th:first-child, .summary-table td:first-child { text-align: left; }
    .summary-table th { color: #555; font-size: 0.8rem; background: #f8fafc; }
    .total-banner { background: #f8fafc; padding: 10px 12px; border-radius: 8px; font-size: 0.95rem; margin-bottom: 8px; border: 1px solid #e2e8f0; }
    .total-banner-main { display: flex; justify-content: space-between; align-items: center; }
    .total-banner-sub { font-size: 0.78rem; color: #64748b; margin-top: 4px; display: flex; justify-content: space-between; }

    .history-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; font-size: 0.9rem; gap: 8px; }
    .history-item:last-child { border-bottom: none; }
    .history-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .edit-btn { width: auto; background: #0ea5e9; padding: 6px 10px; font-size: 0.8rem; margin: 0; }
    .del-btn { width: auto; background: #ff4d4f; padding: 6px 10px; font-size: 0.8rem; margin: 0; }

    /* アーカイブ履歴 */
    .archive-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 0.88rem; color: #475569; }
    .archive-item:last-child { border-bottom: none; }
    .archive-badge { display: inline-block; background: #e2e8f0; color: #475569; font-size: 0.72rem; padding: 2px 7px; border-radius: 10px; margin-bottom: 4px; }

    /* 右下固定 Gemini フローティングボタン */
    .gemini-fab {
      position: fixed;
      right: 18px;
      bottom: 20px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      padding: 0;
      margin: 0;
      background: linear-gradient(135deg, #4285f4 0%, #8b5cf6 55%, #ec4899 100%);
      box-shadow: 0 4px 14px rgba(66, 133, 244, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 900;
      transition: transform 0.15s ease;
    }
    .gemini-fab:active { transform: scale(0.92); }
    .gemini-fab svg { width: 30px; height: 30px; fill: #fff; }

    /* AIチャットポップアップ */
    .chat-panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      justify-content: center;
      align-items: flex-end;
      padding: 12px;
      z-index: 950;
    }
    .chat-panel {
      background: #fff;
      width: 100%;
      max-width: 540px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.22);
      display: flex;
      flex-direction: column;
      max-height: 75vh;
    }
    .chat-header {
      background: linear-gradient(135deg, #4285f4 0%, #8b5cf6 100%);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .chat-close-btn { width: auto; background: rgba(255,255,255,0.22); color: #fff; padding: 4px 10px; margin: 0; font-size: 0.85rem; border-radius: 6px; }
    .chat-box { flex: 1; min-height: 220px; max-height: 50vh; overflow-y: auto; background: #f8fafc; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .chat-msg { max-width: 85%; padding: 9px 12px; border-radius: 12px; font-size: 0.9rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .chat-user { align-self: flex-end; background: #0066cc; color: #fff; border-bottom-right-radius: 2px; }
    .chat-ai { align-self: flex-start; background: #fff; color: #222; border: 1px solid #cbd5e1; border-bottom-left-radius: 2px; }
    .chat-input-row { display: flex; gap: 6px; padding: 10px; background: #fff; border-top: 1px solid #e2e8f0; }
    .chat-input-row input { flex: 1; margin: 0; padding: 10px; font-size: 16px; }
    .chat-input-row button { width: auto; margin: 0; padding: 0 16px; flex-shrink: 0; }

    /* 編集モーダル */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; padding: 16px; z-index: 1000; }
    .modal-content { background: #fff; width: 100%; max-width: 500px; border-radius: 12px; padding: 18px; max-height: 90vh; overflow-y: auto; }
    .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-cancel { background: #94a3b8; }

    .toggle-box { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-top: 8px; border: 1px solid #e1e4e8; }
    .loading { text-align: center; color: #666; font-size: 0.9rem; padding: 8px; }
  </style>
</head>
<body>

  <!-- 1. 旅行の選択とメンバー管理 -->
  <div class="card">
    <h2>
      <span>旅行を選択</span>
      <button class="btn-sub" onclick="toggleTripEditor()">＋ 新規 / メンバー編集</button>
    </h2>
    <select id="tripSelect" onchange="onTripChange()"></select>

    <div id="tripEditor" class="toggle-box" style="display:none;">
      <label class="field-label">旅行名</label>
      <input type="text" id="editTripName" placeholder="例: 2026年11月 熱海旅行">
      <label class="field-label">参加メンバー（カンマ区切り）</label>
      <input type="text" id="editTripMembers" placeholder="例: 勇真,Aさん,Bさん">
      <button class="btn-green" id="saveTripBtn" onclick="saveTripSettings()">この旅行・メンバーを保存</button>
    </div>
  </div>

  <!-- 2. 支払いの記録 -->
  <div class="card">
    <h2>支払いを記録</h2>

    <input type="file" id="receiptInput" accept="image/*" style="display:none;" onchange="handleReceiptUpload(event)">
    <button type="button" class="btn-scan" id="scanBtn" onclick="document.getElementById('receiptInput').click()">
      📷 レシートから自動入力（カメラ / 写真）
    </button>

    <label class="field-label">支払った人</label>
    <select id="payerSelect"></select>

    <label class="field-label">店名 / 全体の内容</label>
    <input type="text" id="itemInput" placeholder="例: スーパー、居酒屋、レンタカー">

    <label class="field-label">支払合計金額（円）</label>
    <input type="number" id="amountInput" inputmode="numeric" placeholder="例: 6000">

    <button type="button" class="btn-opt" id="toggleItemizedBtn" onclick="toggleItemizedMode()">
      📋 品物別に対象者を分ける（オプション）
    </button>

    <div id="bulkParticipantsSection">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
        <label class="field-label" style="margin:0;">誰の分？（対象者）</label>
        <button type="button" class="btn-sub" onclick="toggleAllParticipants()">全員選択 / 解除</button>
      </div>
      <div id="participantsGrid" class="checkbox-grid"></div>
    </div>

    <div id="itemizedSection" class="itemized-box" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong style="font-size:0.9rem;">品物ごとの対象者</strong>
        <button type="button" class="btn-sub" style="background:#0066cc;" onclick="addLineItemRow('', '')">＋ 品物を追加</button>
      </div>
      <div id="lineItemsContainer"></div>
      <div class="tax-note">
        💡 消費税や割引で合計に差額がある場合、各品物の金額比率で自動按分して合算されます。
      </div>
    </div>

    <button id="submitBtn" onclick="addExpense()">スプレッドシートに保存</button>
  </div>

  <!-- 3. 精算結果（未清算分のみ） -->
  <div class="card">
    <h2>
      <span>精算結果（残りの支払い）</span>
      <div class="round-toggle">
        <button type="button" class="round-btn active" id="roundBtn1" onclick="setRoundingUnit(1)">1円単位</button>
        <button type="button" class="round-btn" id="roundBtn100" onclick="setRoundingUnit(100)">100円単位</button>
      </div>
    </h2>
    <div id="settlementList"><div class="loading">読み込み中...</div></div>
    <button type="button" class="btn-line" onclick="copySettlementForLine()">📋 LINE用に精算結果をコピー</button>
    <button type="button" class="btn-archive" id="archiveTripBtn" onclick="archiveTripExpenses()">📦 清算完了（アーカイブへ退避）</button>
  </div>

  <!-- 4. 旅行総出費サマリー（未清算＋アーカイブ合算） -->
  <div class="card">
    <h2>旅行総出費サマリー（累計）</h2>
    <div id="summaryBox"></div>
  </div>

  <!-- 5. 支払い履歴（未清算） -->
  <div class="card">
    <h2>支払い履歴（未清算）</h2>
    <div id="historyList"></div>
  </div>

  <!-- 6. 支払い履歴アーカイブ（清算済み） -->
  <div class="card">
    <h2>
      <span id="archiveTitle">📦 支払い履歴アーカイブ（0件）</span>
      <button type="button" class="btn-sub" id="toggleArchiveBtn" onclick="toggleArchiveList()">開く</button>
    </h2>
    <div id="archiveList" style="display:none;"></div>
  </div>

  <!-- 右下固定 Gemini AIチャット起動ボタン -->
  <button type="button" class="gemini-fab" aria-label="AIチャットを開く" onclick="openChatPanel()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2C12.3 7.2 16.8 11.7 22 12C16.8 12.3 12.3 16.8 12 22C11.7 16.8 7.2 12.3 2 12C7.2 11.7 11.7 7.2 12 2Z"/>
    </svg>
  </button>

  <!-- AIチャットポップアップ -->
  <div id="chatOverlay" class="chat-panel-overlay" onclick="if(event.target===this) closeChatPanel()">
    <div class="chat-panel">
      <div class="chat-header">
        <span>✦ Gemini AIアシスタント</span>
        <button type="button" class="chat-close-btn" onclick="closeChatPanel()">✕ 閉じる</button>
      </div>
      <div id="chatBox" class="chat-box">
        <div class="chat-msg chat-ai">「さっきの居酒屋からBを外して」「コンビニの支払者をAにして」「アーカイブ込みで今いくら使った？」のように話しかけてください。</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="修正や質問を入力..." onkeydown="if(event.key==='Enter') sendAiChat()">
        <button id="chatSendBtn" onclick="sendAiChat()">送信</button>
      </div>
    </div>
  </div>

  <!-- 履歴編集モーダル -->
  <div id="editModal" class="modal-overlay" onclick="if(event.target===this) closeEditModal()">
    <div class="modal-content">
      <h2>支払いを編集</h2>
      <input type="hidden" id="editRecordId">
      <label class="field-label">支払った人</label>
      <select id="editPayerSelect"></select>
      <label class="field-label">内容</label>
      <input type="text" id="editItemInput">
      <label class="field-label">金額（円）</label>
      <input type="number" id="editAmountInput" inputmode="numeric">
      <label class="field-label">対象者</label>
      <div id="editParticipantsGrid" class="checkbox-grid"></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeEditModal()">キャンセル</button>
        <button type="button" id="saveEditBtn" onclick="saveEditedExpense()">変更を保存</button>
      </div>
    </div>
  </div>

<script>
  // ★ここにGASのウェブアプリURLを貼り付ける
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbygks_2kWVuE7GbKGkqyPgWN58GRceDCJ-Fozp0vJskX5wv2e8xMg5gTTfjtz6kUnLa/exec';

  let allRecords = [];
  let allArchives = [];
  let tripMembersMap = {};
  let appPass = '';
  let isItemizedMode = false;
  let roundingUnit = Number(localStorage.getItem('trip_rounding_unit')) || 1;
  let lastRenderedSettlements = [];
  let lastRenderedSummary = [];
  let lastTripTotal = 0;

  window.onload = () => {
    appPass = localStorage.getItem('trip_app_pass');
    if (!appPass) {
      appPass = prompt('合言葉を入力してください') || '';
      if (appPass) localStorage.setItem('trip_app_pass', appPass);
    }
    updateRoundingButtons();
    fetchData();
  };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  function openChatPanel() {
    document.getElementById('chatOverlay').style.display = 'flex';
    const box = document.getElementById('chatBox');
    box.scrollTop = box.scrollHeight;
  }

  function closeChatPanel() {
    document.getElementById('chatOverlay').style.display = 'none';
  }

  function toggleArchiveList() {
    const list = document.getElementById('archiveList');
    const btn = document.getElementById('toggleArchiveBtn');
    const isHidden = list.style.display === 'none';
    list.style.display = isHidden ? 'block' : 'none';
    btn.innerText = isHidden ? '閉じる' : '開く';
  }

  function setRoundingUnit(unit) {
    roundingUnit = unit;
    localStorage.setItem('trip_rounding_unit', unit);
    updateRoundingButtons();
    renderCurrentTrip();
  }

  function updateRoundingButtons() {
    document.getElementById('roundBtn1').classList.toggle('active', roundingUnit === 1);
    document.getElementById('roundBtn100').classList.toggle('active', roundingUnit === 100);
  }

  function toggleItemizedMode(forceState) {
    isItemizedMode = typeof forceState === 'boolean' ? forceState : !isItemizedMode;
    document.getElementById('bulkParticipantsSection').style.display = isItemizedMode ? 'none' : 'block';
    document.getElementById('itemizedSection').style.display = isItemizedMode ? 'block' : 'none';
    document.getElementById('toggleItemizedBtn').innerText = isItemizedMode
      ? '👥 全体まとめて割り勘に戻す'
      : '📋 品物別に対象者を分ける（オプション）';

    if (isItemizedMode && document.getElementById('lineItemsContainer').children.length === 0) {
      addLineItemRow('', '');
    }
  }

  function addLineItemRow(name = '', price = '') {
    const tripName = document.getElementById('tripSelect').value;
    const members = tripMembersMap[tripName] || [];
    const container = document.getElementById('lineItemsContainer');

    const row = document.createElement('div');
    row.className = 'line-item-card';
    row.innerHTML = `
      <div class="line-item-top">
        <input type="text" class="li-name" placeholder="品名" value="${escapeHtml(name)}">
        <input type="number" class="li-price" inputmode="numeric" placeholder="金額" value="${price}">
        <button type="button" class="line-del-btn" onclick="this.closest('.line-item-card').remove()">✕</button>
      </div>
      <div class="mini-chips">
        ${members.map(m => `
          <label class="mini-chip">
            <input type="checkbox" value="${escapeHtml(m)}" checked>
            <span>${escapeHtml(m)}</span>
          </label>
        `).join('')}
      </div>
    `;
    container.appendChild(row);
  }

  async function handleReceiptUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const scanBtn = document.getElementById('scanBtn');
    scanBtn.disabled = true;
    scanBtn.innerText = '⏳ レシートと明細を解析中...';

    try {
      const base64Data = await resizeImageToBase64(file, 900);
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ pass: appPass, action: 'scanReceipt', imageBase64: base64Data })
      });
      const result = await res.json();

      if (result.error) {
        alert(result.error);
      } else {
        if (result.item) document.getElementById('itemInput').value = result.item;
        if (result.amount) document.getElementById('amountInput').value = result.amount;

        if (Array.isArray(result.items) && result.items.length > 0) {
          document.getElementById('lineItemsContainer').innerHTML = '';
          result.items.forEach(it => addLineItemRow(it.name || '', it.price || ''));
        }
      }
    } catch (err) {
      alert('画像の送信・解析に失敗しました');
    } finally {
      scanBtn.disabled = false;
      scanBtn.innerText = '📷 レシートから自動入力（カメラ / 写真）';
      event.target.value = '';
    }
  }

  function resizeImageToBase64(file, maxSide) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxSide || h > maxSide) {
            if (w > h) { h = Math.round(h * maxSide / w); w = maxSide; }
            else { w = Math.round(w * maxSide / h); h = maxSide; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.82).split(',')[1]);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function fetchData() {
    try {
      const res = await fetch(`${GAS_API_URL}?pass=${encodeURIComponent(appPass)}`);
      const data = await res.json();

      if (data.error === 'Unauthorized') {
        alert('合言葉が違います。もう一度入力してください。');
        localStorage.removeItem('trip_app_pass');
        location.reload();
        return;
      }

      if (!data.records || !Array.isArray(data.records)) {
        document.getElementById('settlementList').innerText = 'シート構成を確認してください（Expenses と Trips シートが必要です）';
        return;
      }

      allRecords = data.records;
      allArchives = Array.isArray(data.archives) ? data.archives : [];
      tripMembersMap = data.trips || {};

      // 未清算・アーカイブのどちらかにしかない旅行名も補完
      [...allRecords, ...allArchives].forEach(r => {
        if (r.TripName && !tripMembersMap[r.TripName]) {
          const inferred = new Set([r.Payer, ...String(r.Participants).split(',')].map(s => s.trim()).filter(Boolean));
          tripMembersMap[r.TripName] = [...inferred];
        }
      });

      updateTripDropdown();
      onTripChange();
    } catch (err) {
      document.getElementById('settlementList').innerText = 'データの取得に失敗しました。URLや通信を確認してください。';
    }
  }

  function updateTripDropdown() {
    const select = document.getElementById('tripSelect');
    const currentVal = select.value;
    const tripNames = Object.keys(tripMembersMap);

    if (tripNames.length === 0) {
      select.innerHTML = '<option value="">（上のボタンから旅行を作成してください）</option>';
      document.getElementById('tripEditor').style.display = 'block';
    } else {
      select.innerHTML = tripNames.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
      if (tripNames.includes(currentVal)) select.value = currentVal;
    }
  }

  function toggleTripEditor() {
    const box = document.getElementById('tripEditor');
    const isHidden = box.style.display === 'none';
    box.style.display = isHidden ? 'block' : 'none';
    if (isHidden) {
      const currentTrip = document.getElementById('tripSelect').value;
      document.getElementById('editTripName').value = currentTrip;
      document.getElementById('editTripMembers').value = (tripMembersMap[currentTrip] || []).join(',');
    }
  }

  async function saveTripSettings() {
    const tripName = document.getElementById('editTripName').value.trim();
    const membersRaw = document.getElementById('editTripMembers').value.trim();
    const members = membersRaw.split(/[,、]/).map(s => s.trim()).filter(Boolean);

    if (!tripName || members.length === 0) {
      alert('旅行名と参加メンバー（1人以上）を入力してください');
      return;
    }

    const btn = document.getElementById('saveTripBtn');
    btn.disabled = true;
    btn.innerText = '保存中...';

    try {
      await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ pass: appPass, action: 'saveTrip', tripName, members: members.join(',') })
      });

      tripMembersMap[tripName] = members;
      updateTripDropdown();
      document.getElementById('tripSelect').value = tripName;
      document.getElementById('tripEditor').style.display = 'none';
      onTripChange();
    } catch (e) {
      alert('旅行設定の保存に失敗しました');
    } finally {
      btn.disabled = false;
      btn.innerText = 'この旅行・メンバーを保存';
    }
  }

  function onTripChange() {
    const tripName = document.getElementById('tripSelect').value;
    const members = tripMembersMap[tripName] || [];

    document.getElementById('editTripName').value = tripName;
    document.getElementById('editTripMembers').value = members.join(',');

    const payerSelect = document.getElementById('payerSelect');
    payerSelect.innerHTML = members.length
      ? members.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('')
      : '<option value="">先にメンバーを登録してください</option>';

    const grid = document.getElementById('participantsGrid');
    grid.innerHTML = members.map(m => `
      <label class="check-chip">
        <input type="checkbox" name="participant" value="${escapeHtml(m)}" checked>
        <span>${escapeHtml(m)}</span>
      </label>
    `).join('');

    document.getElementById('lineItemsContainer').innerHTML = '';
    if (isItemizedMode) addLineItemRow('', '');

    renderCurrentTrip();
  }

  function toggleAllParticipants() {
    const boxes = document.querySelectorAll('input[name="participant"]');
    const allChecked = [...boxes].every(b => b.checked);
    boxes.forEach(b => b.checked = !allChecked);
  }

  async function addExpense() {
    const tripName = document.getElementById('tripSelect').value;
    const payer = document.getElementById('payerSelect').value;
    const baseItem = document.getElementById('itemInput').value.trim();
    const totalAmount = Number(document.getElementById('amountInput').value);

    if (!tripName || !payer) {
      alert('先に「＋ 新規 / メンバー編集」から旅行とメンバーを登録してください');
      return;
    }

    const payloadsToSend = [];
    const today = new Date().toLocaleDateString('ja-JP');

    if (!isItemizedMode) {
      const checkedBoxes = [...document.querySelectorAll('input[name="participant"]:checked')];
      const participants = checkedBoxes.map(b => b.value).join(',');
      if (!baseItem || !totalAmount || !participants) {
        alert('内容・金額・対象者（1人以上）を入力してください');
        return;
      }
      payloadsToSend.push({
        pass: appPass, action: 'add', tripName, date: today,
        payer, item: baseItem, amount: totalAmount, participants
      });
    } else {
      const cards = [...document.querySelectorAll('.line-item-card')];
      const lineItems = [];
      for (const card of cards) {
        const name = card.querySelector('.li-name').value.trim() || '品物';
        const price = Number(card.querySelector('.li-price').value);
        const targets = [...card.querySelectorAll('input[type="checkbox"]:checked')].map(c => c.value);
        if (!price || targets.length === 0) {
          alert('すべての品物に「金額」と「1人以上の対象者」を設定してください（不要な行は✕で削除）');
          return;
        }
        lineItems.push({ name, price, targets });
      }

      if (lineItems.length === 0) {
        alert('品物を1つ以上追加してください');
        return;
      }

      const rawSum = lineItems.reduce((sum, it) => sum + it.price, 0);
      const targetTotal = totalAmount > 0 ? totalAmount : rawSum;
      const ratio = rawSum > 0 ? (targetTotal / rawSum) : 1;

      let allocatedSum = 0;
      lineItems.forEach((it, idx) => {
        let adjustedPrice;
        if (idx === lineItems.length - 1) {
          adjustedPrice = Math.round(targetTotal - allocatedSum);
        } else {
          adjustedPrice = Math.round(it.price * ratio);
          allocatedSum += adjustedPrice;
        }
        const label = baseItem ? `${baseItem}（${it.name}）` : it.name;
        payloadsToSend.push({
          pass: appPass, action: 'add', tripName, date: today,
          payer, item: label, amount: adjustedPrice, participants: it.targets.join(',')
        });
      });
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = `保存中... (${payloadsToSend.length}件)`;

    try {
      for (const payload of payloadsToSend) {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.error === 'Unauthorized') {
          alert('合言葉が違います');
          return;
        }
      }

      document.getElementById('itemInput').value = '';
      document.getElementById('amountInput').value = '';
      document.getElementById('lineItemsContainer').innerHTML = '';
      if (isItemizedMode) toggleItemizedMode(false);
      document.querySelectorAll('input[name="participant"]').forEach(b => b.checked = true);
      await fetchData();
    } catch (err) {
      alert('保存に失敗しました');
    } finally {
      btn.disabled = false;
      btn.innerText = 'スプレッドシートに保存';
    }
  }

  // ===== 支払い履歴の編集 =====
  function openEditModal(id) {
    const rec = allRecords.find(r => r.ID === id);
    if (!rec) return;

    const tripName = document.getElementById('tripSelect').value;
    const baseMembers = tripMembersMap[tripName] || [];
    const currentTargets = String(rec.Participants).split(',').map(s => s.trim()).filter(Boolean);
    const allMembers = [...new Set([...baseMembers, rec.Payer, ...currentTargets].filter(Boolean))];

    document.getElementById('editRecordId').value = rec.ID;
    document.getElementById('editItemInput').value = rec.Item;
    document.getElementById('editAmountInput').value = rec.Amount;

    const payerSel = document.getElementById('editPayerSelect');
    payerSel.innerHTML = allMembers.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
    payerSel.value = rec.Payer;

    const grid = document.getElementById('editParticipantsGrid');
    grid.innerHTML = allMembers.map(m => `
      <label class="check-chip">
        <input type="checkbox" name="editParticipant" value="${escapeHtml(m)}" ${currentTargets.includes(m) ? 'checked' : ''}>
        <span>${escapeHtml(m)}</span>
      </label>
    `).join('');

    document.getElementById('editModal').style.display = 'flex';
  }

  function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
  }

  async function saveEditedExpense() {
    const id = document.getElementById('editRecordId').value;
    const payer = document.getElementById('editPayerSelect').value;
    const item = document.getElementById('editItemInput').value.trim();
    const amount = Number(document.getElementById('editAmountInput').value);
    const participants = [...document.querySelectorAll('input[name="editParticipant"]:checked')].map(b => b.value).join(',');

    if (!item || !amount || !participants) {
      alert('内容・金額・対象者（1人以上）を入力してください');
      return;
    }

    const btn = document.getElementById('saveEditBtn');
    btn.disabled = true;
    btn.innerText = '更新中...';

    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ pass: appPass, action: 'edit', id, payer, item, amount, participants })
      });
      const result = await res.json();
      if (result.error) {
        alert(result.error);
      } else {
        closeEditModal();
        await fetchData();
      }
    } catch (err) {
      alert('更新に失敗しました');
    } finally {
      btn.disabled = false;
      btn.innerText = '変更を保存';
    }
  }

  async function deleteExpense(id) {
    if (!confirm('この記録を削除しますか？')) return;
    try {
      await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ pass: appPass, action: 'delete', id })
      });
      await fetchData();
    } catch (err) {
      alert('削除に失敗しました');
    }
  }

  // ===== 清算完了（アーカイブ退避） =====
  async function archiveTripExpenses() {
    const tripName = document.getElementById('tripSelect').value;
    if (!tripName) return;

    const count = allRecords.filter(r => r.TripName === tripName).length;
    if (count === 0) {
      alert('アーカイブする未清算の支払い履歴がありません');
      return;
    }

    if (!confirm(`「${tripName}」の未清算履歴（${count}件）をアーカイブへ退避して清算完了にしますか？\n（総出費サマリーと最下部のアーカイブ欄には引き続き残ります）`)) {
      return;
    }

    const btn = document.getElementById('archiveTripBtn');
    btn.disabled = true;
    btn.innerText = 'アーカイブ中...';

    try {
      await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ pass: appPass, action: 'archiveTrip', tripName })
      });
      await fetchData();
      alert(`「${tripName}」の履歴をアーカイブへ退避しました！`);
    } catch (err) {
      alert('アーカイブ処理に失敗しました');
    } finally {
      btn.disabled = false;
      btn.innerText = '📦 清算完了（アーカイブへ退避）';
    }
  }

  // ===== LINE共有用コピー =====
  function copySettlementForLine() {
    const tripName = document.getElementById('tripSelect').value;
    if (!tripName) return;

    const unitLabel = roundingUnit === 100 ? '（100円単位丸め）' : '';
    let text = `【${tripName} 精算結果${unitLabel}】\n`;

    if (lastRenderedSettlements.length === 0) {
      text += '残りの精算はありません。\n';
    } else {
      lastRenderedSettlements.forEach(s => {
        text += `・${s.from} → ${s.to}：${s.amount.toLocaleString()}円\n`;
      });
    }

    if (lastRenderedSummary.length > 0) {
      text += `\n【旅行累計の総出費】（全体合計：${Math.round(lastTripTotal).toLocaleString()}円）\n`;
      lastRenderedSummary.forEach(u => {
        text += `・${u.person}：${Math.round(u.share).toLocaleString()}円（立替 ${Math.round(u.paid).toLocaleString()}円）\n`;
      });
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => alert('LINE用の精算結果をコピーしました！'))
        .catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('LINE用の精算結果をコピーしました！');
  }

  // ===== AIチャット =====
  function appendChatBubble(role, text) {
    const box = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = `chat-msg ${role === 'user' ? 'chat-user' : 'chat-ai'}`;
    div.innerText = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  async function sendAiChat() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    const tripName = document.getElementById('tripSelect').value;
    if (!message || !tripName) return;

    const sendBtn = document.getElementById('chatSendBtn');
    appendChatBubble('user', message);
    input.value = '';
    sendBtn.disabled = true;
    sendBtn.innerText = '...';

    try {
      const currentRecords = allRecords.filter(r => r.TripName === tripName);
      const currentArchives = allArchives.filter(r => r.TripName === tripName);
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          pass: appPass,
          action: 'aiChat',
          tripName,
          members: tripMembersMap[tripName] || [],
          records: currentRecords,
          archives: currentArchives,
          message
        })
      });
      const result = await res.json();

      if (result.error) {
        appendChatBubble('ai', 'エラー: ' + result.error);
      } else {
        appendChatBubble('ai', result.reply || '完了しました。');
        if (result.mutated) {
          await fetchData();
        }
      }
    } catch (err) {
      appendChatBubble('ai', '通信エラーが発生しました。');
    } finally {
      sendBtn.disabled = false;
      sendBtn.innerText = '送信';
    }
  }

  // ===== 描画処理（精算＝未清算のみ ／ サマリー＝未清算＋アーカイブ） =====
  function renderCurrentTrip() {
    const tripName = document.getElementById('tripSelect').value;
    const records = allRecords.filter(r => r.TripName === tripName);
    const archives = allArchives.filter(r => r.TripName === tripName);
    const combined = [...records, ...archives];
    const members = tripMembersMap[tripName] || [];

    // 1. 未清算の支払い履歴
    const historyEl = document.getElementById('historyList');
    historyEl.innerHTML = records.length ? records.map(r => `
      <div class="history-item">
        <div>
          <strong>${escapeHtml(r.Item)}</strong> (${Number(r.Amount).toLocaleString()}円)<br>
          <small style="color:#555;">支払: ${escapeHtml(r.Payer)} ／ 対象: ${escapeHtml(r.Participants)}</small>
        </div>
        <div class="history-actions">
          <button class="edit-btn" onclick="openEditModal('${escapeHtml(r.ID)}')">編集</button>
          <button class="del-btn" onclick="deleteExpense('${escapeHtml(r.ID)}')">削除</button>
        </div>
      </div>
    `).join('') : '<p style="color:#666; font-size:0.9rem;">未清算の記録はありません</p>';

    // 2. 精算ロジック（未清算 records のみで計算）
    const activeBalances = {};
    let activeTotal = 0;
    members.forEach(m => { activeBalances[m] = 0; });

    records.forEach(r => {
      const amount = Number(r.Amount);
      const payer = String(r.Payer).trim();
      const targets = String(r.Participants).split(',').map(s => s.trim()).filter(Boolean);
      if (targets.length === 0) return;

      activeTotal += amount;
      const splitAmount = amount / targets.length;
      activeBalances[payer] = (activeBalances[payer] || 0) + amount;
      targets.forEach(t => {
        activeBalances[t] = (activeBalances[t] || 0) - splitAmount;
      });
    });

    let debtors = [], creditors = [];
    for (const [person, bal] of Object.entries(activeBalances)) {
      if (bal < -1) debtors.push({ person, amount: -bal });
      if (bal > 1) creditors.push({ person, amount: bal });
    }
    debtors.sort((a, b) => b.amount - a.amount);
    creditors.sort((a, b) => b.amount - a.amount);

    const settlements = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const pay = Math.min(debtors[i].amount, creditors[j].amount);
      const roundedPay = roundingUnit === 100
        ? Math.round(pay / 100) * 100
        : Math.round(pay);

      if (roundedPay > 0) {
        settlements.push({ from: debtors[i].person, to: creditors[j].person, amount: roundedPay });
      }
      debtors[i].amount -= pay;
      creditors[j].amount -= pay;
      if (debtors[i].amount < 1) i++;
      if (creditors[j].amount < 1) j++;
    }

    lastRenderedSettlements = settlements;

    const settlementEl = document.getElementById('settlementList');
    settlementEl.innerHTML = settlements.length
      ? settlements.map(s => `
          <div class="settlement-item">
            ${escapeHtml(s.from)} → ${escapeHtml(s.to)} に <strong>${s.amount.toLocaleString()}円</strong>
          </div>
        `).join('')
      : '<p style="color:#666; font-size:0.9rem;">残りの精算はありません</p>';

    // 3. 旅行総出費サマリー（未清算 records ＋ アーカイブ archives の合算）
    const paidMap = {};
    const shareMap = {};
    let totalSpent = 0;
    let archivedTotal = 0;
    const peopleSet = new Set(members);

    combined.forEach(r => {
      const amount = Number(r.Amount);
      const payer = String(r.Payer).trim();
      const targets = String(r.Participants).split(',').map(s => s.trim()).filter(Boolean);
      if (targets.length === 0) return;

      totalSpent += amount;
      peopleSet.add(payer);
      const splitAmount = amount / targets.length;
      paidMap[payer] = (paidMap[payer] || 0) + amount;
      targets.forEach(t => {
        peopleSet.add(t);
        shareMap[t] = (shareMap[t] || 0) + splitAmount;
      });
    });

    archives.forEach(r => { archivedTotal += Number(r.Amount) || 0; });

    lastTripTotal = totalSpent;
    lastRenderedSummary = [...peopleSet].map(p => ({
      person: p,
      paid: paidMap[p] || 0,
      share: shareMap[p] || 0
    }));

    const summaryEl = document.getElementById('summaryBox');
    if (combined.length === 0) {
      summaryEl.innerHTML = '<p style="color:#666; font-size:0.9rem;">まだデータがありません</p>';
    } else {
      summaryEl.innerHTML = `
        <div class="total-banner">
          <div class="total-banner-main">
            <span>旅行累計の合計出費</span>
            <strong>${Math.round(totalSpent).toLocaleString()}円</strong>
          </div>
          <div class="total-banner-sub">
            <span>未清算: ${Math.round(activeTotal).toLocaleString()}円</span>
            <span>アーカイブ済: ${Math.round(archivedTotal).toLocaleString()}円</span>
          </div>
        </div>
        <table class="summary-table">
          <thead>
            <tr>
              <th>メンバー</th>
              <th>実質負担額</th>
              <th>立替済</th>
            </tr>
          </thead>
          <tbody>
            ${lastRenderedSummary.map(u => `
              <tr>
                <td><strong>${escapeHtml(u.person)}</strong></td>
                <td>${Math.round(u.share).toLocaleString()}円</td>
                <td style="color:#64748b;">${Math.round(u.paid).toLocaleString()}円</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    // 4. 支払い履歴アーカイブ（清算済み）
    document.getElementById('archiveTitle').innerText = `📦 支払い履歴アーカイブ（${archives.length}件）`;
    const archiveEl = document.getElementById('archiveList');
    if (archives.length === 0) {
      archiveEl.innerHTML = '<p style="color:#666; font-size:0.9rem;">アーカイブされた履歴はありません</p>';
    } else {
      // 新しくアーカイブされたものが上に来るよう逆順表示
      archiveEl.innerHTML = [...archives].reverse().map(r => `
        <div class="archive-item">
          <span class="archive-badge">清算済 ${escapeHtml(r.ArchivedAt || r.Date || '')}</span><br>
          <strong>${escapeHtml(r.Item)}</strong> (${Number(r.Amount).toLocaleString()}円)<br>
          <small>支払: ${escapeHtml(r.Payer)} ／ 対象: ${escapeHtml(r.Participants)}</small>
        </div>
      `).join('');
    }
  }
</script>
